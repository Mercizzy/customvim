# =============================================================================
#  .tmux.conf —— 面向“一个项目一个会话”的开发工作流
#  前缀键改为 C-a；C-h/j/k/l 在 vim 与 tmux 面板之间无缝移动
#  重载：tmux source-file ~/.tmux.conf   （或 prefix + r）
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 基础
# -----------------------------------------------------------------------------
set -g default-shell /bin/bash
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off
setw -g automatic-rename on
set -g allow-rename off
set -g visual-activity off
set -g visual-bell off
set -g set-titles on
set -g set-titles-string "#S | #W"

# 真彩色（Vim 的 termguicolors 依赖它）
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# 前缀键：C-a（比 C-b 顺手；原 C-b 仍可透传给内层程序）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 重载配置
#@ 重新加载 tmux 配置
bind r source-file ~/.tmux.conf \; display-message "tmux 配置已重载"

# -----------------------------------------------------------------------------
# 2. 分屏
# -----------------------------------------------------------------------------
#@ 左右分屏（保持当前目录）
bind | split-window -h -c "#{pane_current_path}"
#@ 上下分屏（保持当前目录）
bind - split-window -v -c "#{pane_current_path}"
#@ 新建窗口（保持当前目录）
bind c new-window -c "#{pane_current_path}"

# 面板切换：用 vim 风格的 C-h/j/k/l（与 vim-tmux-navigator 联动）
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# 面板大小调整（前缀 + H/J/K/L）
#@ 面板宽度 -5
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 面板最大化 / 还原
#@ 当前面板最大化 / 还原
bind m resize-pane -Z

# -----------------------------------------------------------------------------
# 3. 复制模式（vi 风格，复制到 Windows 剪贴板）
# -----------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi Escape send -X cancel

# 双击 / 三击选择
bind -T copy-mode-vi DoubleClick1Pane send -X select-word
bind -T copy-mode-vi TripleClick1Pane send -X select-line

# -----------------------------------------------------------------------------
# 4. 会话与项目
# -----------------------------------------------------------------------------
# prefix + f：模糊选择项目目录，自动 attach/切换对应会话
# 会话选择器：tmux-sessionx（带预览、可删除/重命名）
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'f'
set -g @sessionx-custom-paths "$HOME/code,/mnt/d"
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '80%'

# 快速新建/切换会话列表
bind s choose-tree -Zs

# 快捷键速查插件（plugins/tmux-cheatsheet，TPM clone 本仓库后自动加载）
set -g @cheatsheet-key '?'
if-shell "test -x ~/.tmux/plugins/customvim/customvim.tmux" \
  "run-shell ~/.tmux/plugins/customvim/customvim.tmux"

# 弹窗外观（tmux 3.3+）
set -g popup-border-lines rounded
set -g popup-border-style "fg=#61AFEF,bg=#282C34"
set -g popup-style "fg=#ABB2BF,bg=#282C34"

# 保持窗口序号不跳动
set -g renumber-windows on

# -----------------------------------------------------------------------------
# 5. 外观
# -----------------------------------------------------------------------------
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
# 状态栏：Catppuccin Mocha（tmux 侧主题）
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_background 'none'
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

set -g status-left-length 60
set -g status-right-length 120
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_date_time}"

# 窗口标签显示「当前目录名」：默认的 #T 是终端标题，WSL 下会变成主机名
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

# 状态栏底色和 Neovim / 终端保持一致（不依赖终端默认背景）
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g pane-border-style        "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"

set -g message-style         "bg=#3e4451,fg=#abb2bf"
set -g message-command-style "bg=#3e4451,fg=#abb2bf"

# -----------------------------------------------------------------------------
# 6. 插件（tpm）
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# 自动保存/恢复会话（跨重启保留工作现场）
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# 前缀提示（状态栏）
set -g @prefix_highlight_fg '#282c34'
set -g @prefix_highlight_bg '#e06c75'

# sessionx 底部提示换成中文文案（插件更新后会自动重新打补丁）
run-shell -b "$HOME/.tmux/plugins/customvim/bin/patch-sessionx-header.sh 2>/dev/null || true"

# 初始化 tpm（必须放在最后）
run '~/.tmux/plugins/tpm/tpm'
